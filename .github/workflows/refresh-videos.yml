# Daily (and manual) refresh of the Latest Uploads snapshot from the YouTube
# channel RSS feed. Prefers a small automated PR over committing straight to
# main so a bad feed parse never lands without review.
#
# Prebuild (`npm run build`) still runs the same script non-fatally. This job
# uses --strict so refresh failures fail the Action loudly.
name: Refresh videos

on:
  schedule:
    # 06:00 UTC daily — after typical overnight uploads, before EU morning.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-videos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Refresh YouTube feed (strict)
        run: npm run refresh:videos -- --strict

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh YouTube Latest Uploads snapshot"
          title: "chore: refresh YouTube Latest Uploads snapshot"
          body: |
            Automated refresh of `src/data/videos.generated.json` from the
            channel RSS feed (`scripts/refresh-videos.mjs`).

            - Trigger: daily cron (06:00 UTC) or manual `workflow_dispatch`
            - Failure mode: this workflow runs with `--strict` and fails the
              job if the feed cannot produce a valid long-form reel
            - Production `prebuild` remains non-fatal and keeps the last good
              snapshot / pinned fallback

            See [docs/video-feed-refresh.md](docs/video-feed-refresh.md).
          branch: chore/refresh-videos
          delete-branch: true
          add-paths: |
            src/data/videos.generated.json
