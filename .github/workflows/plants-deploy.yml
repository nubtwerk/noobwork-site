name: Deploy Plants

# Optional CI deploy — the easiest path is Vercel Git integration (see plants/README.md).
# Requires GitHub secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PLANTS_PROJECT_ID
# Enable explicitly with the PLANTS_ACTIONS_DEPLOY_ENABLED repository variable.

on:
  push:
    branches: [main]
    paths:
      - "plants/**"
      - ".github/workflows/plants-deploy.yml"
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PLANTS_PROJECT_ID }}

permissions:
  contents: read

jobs:
  verify:
    if: vars.PLANTS_ACTIONS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plants/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  deploy:
    if: vars.PLANTS_ACTIONS_DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plants
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plants/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
